<!DOCTYPE html>

<html lang="zh-Hant">
<head>

<title>光色實驗室｜一頁式互動教學</title>
<style>
:root{--ink:#202337;--sub:#797e91;--line:#e4e5ec;--purple:#6558df;--soft:#f6f5fc;--stage:#16182b;--red:#ff5267;--green:#47d59d;--blue:#5799ff}
*{box-sizing:border-box}body{margin:0;background:#f7f7fa;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #b7afff;outline-offset:2px}
.app{max-width:1500px;margin:auto;padding:25px 30px 18px;min-height:100dvh;display:flex;flex-direction:column;gap:19px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;background:#24243e;border-radius:15px;display:grid;place-items:center;font-size:25px;color:#fff;box-shadow:0 8px 20px #25234223}h1{font-size:24px;letter-spacing:.05em;margin:0;font-weight:850}.subtitle{margin:3px 0 0;font-size:12px;color:var(--sub);font-weight:650;letter-spacing:.1em}.topnote{background:white;border:1px solid var(--line);border-radius:50px;padding:10px 17px;font-size:13px;color:#696c80;font-weight:650}.topnote strong{color:var(--purple)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(245px,288px) minmax(370px,1fr) minmax(245px,286px);gap:16px;align-items:stretch}.panel{background:white;border:1px solid #e7e7ee;border-radius:23px;box-shadow:0 12px 38px #28234d09;padding:22px;min-width:0}.panel-head{font-size:11px;color:var(--purple);letter-spacing:.12em;font-weight:850;margin-bottom:9px}.panel h2{font-size:22px;line-height:1.28;margin:0 0 17px;font-weight:850}.section{margin-bottom:25px}.section:last-child{margin-bottom:0}.section-title{font-size:13px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}.num{background:#f0efff;color:var(--purple);width:23px;height:23px;display:inline-grid;place-items:center;border-radius:8px;font-size:12px}
.segment{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#f4f4f8;border-radius:13px;padding:5px}.segment button{border:0;background:none;color:#85889b;padding:12px 4px;border-radius:10px;font-size:13px;font-weight:800}.segment button.active{color:var(--purple);background:white;box-shadow:0 3px 11px #24234b12}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice{border:1.5px solid #e8e9ef;background:white;border-radius:13px;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:750;color:#707488;min-height:74px}.choice.active{border-color:#8174ef;background:#f5f3ff;color:#5144c9;box-shadow:0 0 0 2px #eae6ff}.swatch{height:24px;width:24px;border-radius:8px;border:1px solid #0000000e;box-shadow:inset 0 0 0 1px #ffffff38}.rgb{display:flex;gap:2px}.rgb i{width:8px;height:24px;border-radius:3px;display:block}.tip{font-size:12px;color:#898c9b;line-height:1.7;margin:13px 0 0}.choice.black .swatch{border-color:#38384a}.stagewrap{display:flex;flex-direction:column;gap:14px;min-width:0}.stage{position:relative;flex:1;min-height:380px;background:radial-gradient(ellipse at 51% 35%,#292e4e 0%,#191d33 48%,#121529 100%);color:white;border-radius:25px;overflow:hidden;box-shadow:0 15px 45px #292b4920}.stage-top{position:absolute;z-index:2;left:25px;right:25px;top:22px;display:flex;justify-content:space-between;align-items:center}.stage-tag{font-size:11px;letter-spacing:.16em;font-weight:800;color:#aeb6d8}.live{display:flex;align-items:center;gap:7px;font-size:11px;color:#adb5d6}.dot{width:7px;height:7px;border-radius:50%;background:#71dcbb;box-shadow:0 0 11px #71dcbb}.stage svg{display:block;position:absolute;inset:0;width:100%;height:100%}.stagebottom{position:absolute;bottom:23px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.07em;color:#c0c4e2}.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;background:#fff;border-radius:15px;border:1px solid var(--line);padding:13px}.legend span{font-size:12px;font-weight:750;color:#686f80;display:flex;align-items:center;gap:7px}.pilldot{width:10px;height:10px;border-radius:50%;display:inline-block}.stage svg .beam{transition:opacity .3s ease}.stage svg .beamline{stroke-linecap:round;stroke-width:5.5;filter:url(#glow)}.stage svg .core{stroke-linecap:round;stroke-width:2;opacity:.92}.stage svg .txt{font-size:13px;fill:#aeb6d4;font-weight:700}.stage svg .hint{font-size:11px;fill:#737eab}.stage svg .target{fill:#20243b;stroke:#656d94;stroke-width:1.4}.paper-glow{filter:url(#paperGlow)}
.question{border-radius:17px;background:#f6f5fc;padding:18px 15px;margin-bottom:16px}.question .mini{font-size:11px;color:#8178d0;font-weight:850;letter-spacing:.12em}.question p{font-size:18px;font-weight:850;line-height:1.5;margin:8px 0 0}.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.answer{border:1.5px solid #e5e7ee;border-radius:13px;background:white;display:flex;align-items:center;gap:11px;padding:12px 11px;font-size:14px;color:#3c4056;font-weight:800}.answer:hover{border-color:#b7b0fa}.answer.selected{background:#f5f3ff;border-color:#7366ed}.answer .bubble{width:23px;height:23px;border-radius:50%;border:1px solid #e2e2eb}.primary{border:0;background:#6657e8;color:white;border-radius:13px;width:100%;margin-top:16px;padding:14px;font-size:15px;font-weight:850;box-shadow:0 8px 18px #6859e52c}.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}.feedback{margin-top:13px;border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.7;background:#f0fbf6;color:#237354;display:none}.feedback.bad{background:#fff4f0;color:#a75d38}.feedback.show{display:block}.reset{width:100%;border:0;background:transparent;color:#8b8c9e;padding:12px;font-size:12px;font-weight:750}.foot{display:flex;justify-content:space-between;align-items:center;color:#9599a9;font-size:11px;padding:0 3px;gap:12px}.foot strong{color:#64697e}.helper{display:inline-block;background:#edeaff;color:#6558df;border-radius:7px;padding:3px 7px;font-size:11px;margin-left:3px}
@media(max-width:1130px){.app{padding:17px;gap:13px}.layout{grid-template-columns:240px minmax(300px,1fr);gap:12px}.right{grid-column:1/-1}.right .rightinner{display:grid;grid-template-columns:1fr 1fr;gap:20px}.right .question{margin:0}.right .answers-area{align-self:center}.stage{min-height:350px}.panel{padding:18px}}
@media(max-width:700px){.app{padding:12px;gap:12px}.layout{display:flex;flex-direction:column}.brand h1{font-size:20px}.logo{width:39px;height:39px}.topnote{display:none}.panel{border-radius:18px;padding:16px}.panel h2{font-size:18px;margin-bottom:12px}.controls .section{margin-bottom:16px}.stage{min-height:340px;flex:none}.stagewrap{order:0}.controls{order:1}.right{order:2}.right .rightinner{display:block}.right .question{margin-bottom:15px}.foot{line-height:1.5}.choices{gap:8px}.stage-top{left:17px;right:17px}.stagebottom{font-size:10px}}

.controls .section{margin-bottom:15px}
.controls .section:nth-of-type(3){margin-bottom:0}
.controls .section-title{margin-bottom:8px}

.controls .choice{min-height:73px;padding:10px 0 8px;gap:7px;min-width:0;font-size:12px}
.controls .tip{margin-top:8px;min-height:41px;font-size:11px;line-height:1.65}
.controls .segment button{padding:10px 4px}
.controls .section:nth-of-type(2) .choices button{min-width:0}
@media(min-width:701px){
 html,body{height:100%;overflow:hidden}
 .app{height:100dvh;min-height:0;overflow:hidden;padding:clamp(10px,1.6vh,21px) clamp(12px,2vw,30px);gap:clamp(8px,1.4vh,16px)}
 .layout{flex:1;min-height:0;grid-template-columns:minmax(237px,270px) minmax(300px,1fr) minmax(240px,270px);gap:12px}
 .panel{padding:clamp(13px,1.7vw,20px);overflow:hidden}
 .panel h2{font-size:clamp(17px,1.5vw,21px);margin-bottom:clamp(10px,1.6vh,17px)}
 .stage{min-height:0!important;height:100%}
 .stagewrap{min-height:0;gap:9px}
 .legend{padding:9px}
 .right{grid-column:auto}
 .right .rightinner{display:block}

 .question p{font-size:clamp(15px,1.4vw,18px)}

}
@media(min-width:701px) and (max-height:720px){
 .app{padding-top:9px;padding-bottom:9px;gap:8px}
 .logo{width:38px;height:38px}
 h1{font-size:20px}
 .subtitle{font-size:10px}
 .section-title{margin-bottom:5px}
 .controls .section{margin-bottom:8px}

@media(max-width:700px){
 .controls .choices{grid-template-columns:repeat(5,minmax(0,1fr))}

/* Smaller object-color buttons: all five colors stay on one row. */
#papers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;min-width:0}
#papers .choice{width:100%;min-width:0;min-height:57px;padding:6px 0 5px;gap:4px;border-radius:10px;font-size:11px;white-space:nowrap}

/* Enlarged experiment-setting controls: legible on classroom projection. */
.controls .panel-head{font-size:13px;letter-spacing:.09em}

.controls .section-title{font-size:16px;font-weight:850;gap:9px}
.controls .num{width:27px;height:27px;font-size:14px}
.controls .segment button{font-size:15px;padding:12px 3px}
.controls .tip{font-size:13px;line-height:1.55;min-height:0}

.controls .choice{font-size:13px;min-height:71px;padding:9px 0 7px}
.controls .swatch{height:25px;width:25px}

#papers .choice{font-size:12px;min-height:67px;gap:6px;padding:8px 0 7px}
#papers .choice .swatch{width:25px;height:25px}
@media(min-width:701px){
 .layout{grid-template-columns:minmax(292px,320px) minmax(280px,1fr) minmax(235px,270px)}
 .controls .section{margin-bottom:clamp(12px,2vh,24px)}
 .controls .section-title{margin-bottom:10px}
}
@media(min-width:701px) and (max-height:720px){
 .controls h2{font-size:20px;margin-bottom:9px}
 .controls .section-title{font-size:14px;margin-bottom:6px}
 .controls .section{margin-bottom:10px}
 .controls .segment button{font-size:14px;padding:9px 3px}
 .controls .choice{min-height:57px;padding:5px 0;gap:4px}
 #papers .choice{min-height:56px;padding:5px 0;gap:3px}
 .controls .swatch,#papers .choice .swatch{width:21px;height:21px}
 .controls .rgb i{height:21px}

}
@media(max-width:700px){
 .controls h2{font-size:21px}
 .controls .section-title{font-size:16px}
 .controls .segment button{font-size:15px}
 #papers .choice{font-size:11px;min-height:64px}
}

/* 物體種類：兩個按鈕各佔一半寬度，避免文字、外框互相擠壓。 */
.controls .segment{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 width:100%;min-width:0;gap:7px;padding:5px;
}
.controls .segment button{
 box-sizing:border-box;display:flex;align-items:center;justify-content:center;
 width:100%;min-width:0;max-width:100%;
 padding:11px 5px;font-size:clamp(12px,1.15vw,15px);
 line-height:1.3;white-space:nowrap;overflow:hidden;
}
/* 稍微優化設定區垂直間距，讓三組控制項各自獨立不擠在一起。 */
.controls .section{min-width:0}
.controls .section:nth-of-type(2){margin-bottom:clamp(12px,2vh,20px)}
@media(max-width:700px){
 .controls .segment button{font-size:14px;padding:12px 5px}
}


/* FIX: keep each mode inside its own button even with browser zoom or a narrow side panel. */
.controls .segment{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;

  max-width:100% !important;

}

  display:grid !important;

  font-size:clamp(12px,1vw,14px) !important;
  letter-spacing:0 !important;

<body>
<main class="app">
<header><div class="brand"><div class="logo">✦</div><div><h1>光色實驗室 <span style="color:#8c83db;font-weight:600">/ COLOR LAB</span></h1><p class="subtitle">國中理化 · 光的透射與反射</p></div></div><div class="topnote">先預測，再揭曉 <strong>✦</strong></div></header>
<div class="layout">
<aside class="panel controls"><div class="panel-head">01 · 實驗設定</div><h2>打造你的光線組合</h2>
<div class="section"><div class="section-title"><span class="num">1</span> 照射的光</div><div class="choices" id="lights"></div><p class="tip">白光 = <b>紅＋綠＋藍</b> 三色光。</p></div>
<div class="section"><div class="section-title"><span class="num">2</span> 物體種類</div><div class="segment"><button class="active" data-mode="transparent" type="button">透明物體</button><button data-mode="opaque" type="button">不透明物體</button></div></div>
<div class="section"><div class="section-title"><span class="num">3</span> 物體顏色</div><div class="choices" id="papers"></div><p class="tip" id="materialTip">彩色透明片只讓某些顏色的光通過。</p></div></aside>
<section class="stagewrap"><div class="stage">
<svg aria-label="光線射向色紙並透射或反射的示意圖" id="diagram" role="img" viewbox="0 0 650 430"><defs><filter height="300%" id="glow" width="220%" x="-60%" y="-100%"><fegaussianblur stddeviation="6"></fegaussianblur></filter><filter height="240%" id="paperGlow" width="240%" x="-70%" y="-70%"><fegaussianblur stddeviation="9"></fegaussianblur></filter></defs><g id="rays"></g><g id="object"></g></svg>
</div></section>
<aside class="panel right"><div class="rightinner"><div><div class="panel-head">02 · 觀察挑戰</div><h2>你預測會看到什麼？</h2><div class="question"><span class="mini">THINK FIRST / 先思考</span><p id="question">白光照射紅色透明片，會透出什麼顏色的光？</p></div></div><div class="answers-area"><div class="section-title">選擇你的答案 <span class="helper">單選</span></div><div class="answer-grid" id="answers"></div><button class="primary" disabled="" id="check" type="button">揭曉答案 →</button><div aria-live="polite" class="feedback" id="feedback"></div><button class="reset" id="again" type="button">↻ 重新預測</button></div></div></aside>
</div>
<footer class="foot"><span>教學用理想化模型：真實濾光片與紙張可能有少量漏光、反光；「黑色」表示非常暗，非絕對無光。</span><strong>RGB · TRANSMISSION · REFLECTION</strong></footer>
</main>
<script>
const names={red:'紅',green:'綠',blue:'藍',white:'白',black:'黑'};
const colors={red:'#ff5267',green:'#47d59d',blue:'#5799ff',white:'#ffffff',black:'#11131c'};
let mode='transparent',light='white',paper='red',selected=null,revealed=false;
const $=s=>document.querySelector(s);
function incoming(){return light==='white'?['red','green','blue']:[light]}
function remaining(){return paper==='black'?[]:paper==='white'?incoming():incoming().filter(x=>x===paper)}
function outcome(){const arr=remaining();return arr.length===0?'black':arr.length===3?'white':arr[0]}
function cards(target,list,active,click){target.innerHTML=list.map(c=>`<button type="button" class="choice ${c===active?'active':''} ${c==='black'?'black':''}" data-value="${c}" aria-pressed="${c===active}">${c==='white'&&target.id==='lights'?'<span class="rgb"><i style="background:#ff5267"></i><i style="background:#47d59d"></i><i style="background:#5799ff"></i></span>':`<span class="swatch" style="background:${colors[c]}"></span>`}<span>${names[c]}${target.id==='lights'?'光':''}</span></button>`).join('');target.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>click(b.dataset.value)))}
function resetAnswer(){selected=null;revealed=false;$('#feedback').className='feedback';$('#feedback').innerHTML='';$('#check').disabled=true;$('#check').textContent='揭曉答案 →'}
function draw(){const R=$('#rays'),O=$('#object');const inc=incoming(),out=remaining();let rays='';
// White is intentionally depicted with three separately visible RGB rays, rather than one white stroke.
inc.forEach((c,i)=>{const y=inc.length===3?174+i*34:208;const z=colors[c];rays+=`<path class="beamline" d="M 70 ${y} L 320 ${y}" stroke="${z}" opacity=".65"/><path class="core" d="M 70 ${y} L 320 ${y}" stroke="${z}"/>`});
if(mode==='transparent')out.forEach((c,i)=>{let y=inc.length===3?174+inc.indexOf(c)*34:208;const z=colors[c];rays+=`<path class="beamline" d="M 336 ${y} L 577 ${y}" stroke="${z}" opacity=".6"/><path class="core" d="M 336 ${y} L 577 ${y}" stroke="${z}"/>`});
if(mode==='opaque')out.forEach((c,i)=>{let y=inc.length===3?174+inc.indexOf(c)*34:208;let ey=62+out.indexOf(c)*19;const z=colors[c];rays+=`<path class="beamline" d="M 323 ${y} L 142 ${ey}" stroke="${z}" opacity=".53"/><path class="core" d="M 323 ${y} L 142 ${ey}" stroke="${z}"/>`});
R.innerHTML=rays;const trans=mode==='transparent';O.innerHTML=`<rect x="319" y="130" width="18" height="155" rx="6" fill="${colors[paper]}" opacity=".19" class="paper-glow"/><rect x="319" y="130" width="18" height="155" rx="5" fill="${colors[paper]}" fill-opacity="${trans?.73:1}" stroke="#f6f7ff" stroke-opacity=".73" stroke-width="2"/><rect x="58" y="158" width="17" height="98" rx="7" fill="#555c7c"/><rect x="68" y="191" width="15" height="30" rx="6" fill="${light==='white'?'#fff':colors[light]}"/><circle cx="70" cy="206" r="17" fill="${light==='white'?'#fff':colors[light]}" opacity=".11"/>${trans?'<rect x="574" y="137" width="12" height="142" rx="4" fill="#3d4565" stroke="#677194"/>':''}`;

}
function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));cards($('#lights'),['white','red','green','blue'],light,c=>{light=c;refresh()});cards($('#papers'),mode==='transparent'?['red','green','blue','white']:['red','green','blue','black','white'],paper,c=>{paper=c;refresh()});$('#materialTip').textContent=mode==='transparent'?(paper==='white'?'白色透明片讓紅、綠、藍光都通過。':`${names[paper]}色透明片讓${names[paper]}光通過，其他色光大多被吸收。`):(paper==='white'?'白色色紙反射紅、綠、藍光。':paper==='black'?'黑色色紙吸收大部分色光，幾乎不反射光。':`${names[paper]}色色紙反射${names[paper]}光，其他色光大多被吸收。`);const verb=mode==='transparent'?'透出':'呈現';$('#question').textContent=`${names[light]}光照射${names[paper]}色${mode==='transparent'?'透明片':'紙'}，會${verb}什麼顏色？`;$('#answers').innerHTML=['red','green','blue','white','black'].map(c=>`<button type="button" class="answer ${selected===c?'selected':''}" data-answer="${c}"><span class="bubble" style="background:${colors[c]}"></span>${names[c]}色</button>`).join('');$('#answers').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(revealed)return;selected=b.dataset.answer;$('#check').disabled=false;renderAnswers()}));draw()}
function renderAnswers(){$('#answers').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.answer===selected))}
function refresh(){resetAnswer();render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;if(mode==='transparent'&&paper==='black')paper='red';refresh()}));
$('#check').addEventListener('click',()=>{if(selected===null)return;revealed=true;const ans=outcome(),correct=selected===ans;const where=mode==='transparent'?'通過':'反射';const incomingText=light==='white'?'紅、綠、藍三色光':names[light]+'光';let why;if(paper==='black')why='黑紙吸收大部分入射光，因此看起來接近黑色。';else if(paper==='white')why=mode==='transparent'?`無色透明片讓${incomingText}通過。`:`白紙能反射入射的${incomingText}。`;else if(ans==='black')why=`${names[paper]}色${mode==='transparent'?'透明片':'紙'}主要${where}${names[paper]}光，但這次沒有相應色光可${where}，因此看起來很暗。`;else why=`${names[paper]}色${mode==='transparent'?'透明片':'紙'}主要${where}${names[paper]}光，其他色光大多被吸收。`;$('#feedback').className='feedback show'+(correct?'':' bad');$('#feedback').innerHTML=`<strong>${correct?'✓ 答對了！':'✦ 再觀察一次！'} 正確答案：${names[ans]}色</strong><br>${why}`;$('#check').textContent='已揭曉';$('#check').disabled=true});
$('#again').addEventListener('click',refresh);render();
</script>
</body></html>
